  - author: "Ioana N."
    rating: 5
    text: |-
      Recomand cu tot dragul această clinică. În sfârșit pentru prima dată în viață pot spune ca am un zâmbet exact așa cum mi-am dorit mereu.

      Doamna doctor Julieta mi-a prezentat încă de la prima consultație variantele și m-a sfătuit care e cea mai bună variantă pentru mine. Am făcut 3 probe ca să se asigure ca totul e perfect, eu una as fi acceptat și prima probă.

      Am așteptat câteva luni pana sa dau acest review ca sa vad cum se comportă noii dinți, și tot ce pot spune e că pare ca așa au fost mereu.

      Vă mulțumesc frumos ca m-ați ajutat să am un zâmbet perfect!
