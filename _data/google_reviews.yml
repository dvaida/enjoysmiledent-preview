      De la prima vizita am fost intampinata cu un zambet. Dar in primul rand vreau sa vorbesc despre aceasta echipa de medici,oameni minunati incepand cu doamna Dr.Julieta Ravnic & Dr.Cosmin Ravnic care nu m-au tratat ce pe un client ci ca pe cineva drag.  Avand o lucrare destul de complexa, totul a decurs foarte bine prin profesionalismul, amabilitatea si serviciile la cele mai inalte standarde si tehnica de exceptie.
      Sunt extrem de multumita si recomand cu toata increderea Enjoy Smile Dent!😃👏
  - author: "Andrei N."
    rating: 5
    text: |-
      Am avut parte de un serviciu excelent la Enjoy Smile Dent!

      Nadina de la recepție este super drăguță și zâmbăreață.

      Am venit in prima fază cu un abces nefericit. Doamna doctor Răvnic și cu domnul doctor Răvnic au lucrat impecabil și au scos dintele infectat, au pus ulterior implant și peste coroană ceramică. Totul cu grijă față de confortul meu.

      Ulterior mi-am făcut și o albire, care a dat rezultate excelente.

      Nu am cuvinte de laudă destule sincer.

      Și nu, nu îs plătit de ei să zic asta (dacă nu iei în considerare mostra de pastă de dinți elmax)

      Vă recomand să apelați la serviciile lor.
